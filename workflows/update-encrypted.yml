name: Update Encrypted Portfolio Data

on:
  schedule:
    - cron: '0 21 * * 1-5' # Weekdays post-close
  workflow_dispatch:

jobs:
  build-and-encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas pycryptodome

      - name: Run Update & Encrypt Script
        env:
          SECRET_PASSPHRASE: ${{ secrets.CLIENT_PASSPHRASE }}
        run: |
          python update_and_encrypt.py

      - name: Commit Encrypted Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_data.enc
          git commit -m "chore: auto-update encrypted portfolio" || exit 0
          git push
